name: EAS Build & Submit Android

on:
  push:
    branches: [main, master]
    paths: ['mobile/**']
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile'
        required: true
        default: 'production'
        type: choice
        options: [production, preview, development]
      submit:
        description: 'Submit to Google Play after build?'
        required: true
        default: 'true'
        type: choice
        options: ['true', 'false']

jobs:
  build:
    name: Build Android (${{ github.event.inputs.profile || 'production' }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Install dependencies
        run: cd mobile && npm ci

      - name: Write google-services.json
        if: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > mobile/google-services.json

      - name: Write placeholder google-services.json
        if: ${{ secrets.GOOGLE_SERVICES_JSON == '' }}
        run: |
          cat > mobile/google-services.json << 'EOF'
          {"project_info":{"project_number":"000000000000","project_id":"greenpulse-placeholder","storage_bucket":"greenpulse-placeholder.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000","android_client_info":{"package_name":"app.greenpulse.android"}},"api_key":[{"current_key":"placeholder"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}
          EOF

      - name: Build Android
        id: build
        run: |
          cd mobile
          PROFILE="${{ github.event.inputs.profile || 'production' }}"
          eas build --platform android --profile "$PROFILE" --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Submit to Google Play Internal Testing
        if: ${{ github.event.inputs.submit != 'false' && (github.event.inputs.profile == 'production' || github.event.inputs.profile == '') }}
        run: cd mobile && eas submit --platform android --profile production --latest --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build summary
        if: always()
        run: |
          echo "## Android Build" >> $GITHUB_STEP_SUMMARY
          echo "- Profile: ${{ github.event.inputs.profile || 'production' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Dashboard: https://expo.dev/projects/greenpulse/builds" >> $GITHUB_STEP_SUMMARY
