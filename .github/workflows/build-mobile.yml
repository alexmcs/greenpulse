name: EAS Build & Submit Android

on:
  push:
    branches: [main, master]
    paths: ['mobile/**']
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile'
        required: true
        default: 'production'
        type: choice
        options: [production, preview, development]
      submit:
        description: 'Submit to Google Play after build?'
        required: true
        default: 'true'
        type: choice
        options: ['true', 'false']

jobs:
  build:
    name: Build Android (${{ github.event.inputs.profile || 'production' }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: Install dependencies
        run: cd mobile && npm ci --legacy-peer-deps

      - name: Override google-services.json from secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > mobile/google-services.json
          fi

      - name: Build Android
        id: build
        run: |
          cd mobile
          PROFILE="${{ github.event.inputs.profile || 'production' }}"
          eas build --platform android --profile "$PROFILE" --non-interactive --no-wait
          echo "Build submitted! Monitor at: https://expo.dev/accounts/alexmcs/projects/greenpulse/builds"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Submit to Google Play Internal Testing
        if: ${{ github.event.inputs.submit != 'false' && (github.event.inputs.profile == 'production' || github.event.inputs.profile == '') }}
        run: cd mobile && eas submit --platform android --profile production --latest --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build summary
        if: always()
        run: |
          echo "## Android Build" >> $GITHUB_STEP_SUMMARY
          echo "- Profile: ${{ github.event.inputs.profile || 'production' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Dashboard: https://expo.dev/projects/greenpulse/builds" >> $GITHUB_STEP_SUMMARY
